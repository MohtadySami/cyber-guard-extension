<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Cyber Guard">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- subtle radar / focus rings -->
  <g fill="none" stroke="#10B981" stroke-opacity="0.26" stroke-width="2">
    <circle cx="64" cy="64" r="42"/>
    <circle cx="64" cy="64" r="30"/>
    <circle cx="64" cy="64" r="18"/>
  </g>
  <!-- focus crosshair -->
  <g stroke="#10B981" stroke-opacity="0.34" stroke-width="2" stroke-linecap="round">
    <line x1="64" y1="14" x2="64" y2="26"/>
    <line x1="64" y1="102" x2="64" y2="114"/>
    <line x1="14" y1="64" x2="26" y2="64"/>
    <line x1="102" y1="64" x2="114" y2="64"/>
  </g>

  <!-- glowing centre dot -->
  <circle cx="64" cy="64" r="9" fill="url(#core)" filter="url(#glow)"/>
</svg>
